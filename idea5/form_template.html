<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page description study</title>
<style>
  :root { --ink: #222; --muted: #5d5d5d; --line: #ccc; --accent: #2b6cb0; --bg: #f4f4f4; --panel: #fff; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; margin: 0; background: var(--bg); color: var(--ink); }
  header { background: #2b3a4a; color: #fff; padding: 8px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header .grow { flex: 1; }
  header button, header label { font-size: 13px; }
  #progress { width: 200px; height: 10px; background: #556; border-radius: 5px; overflow: hidden; display: inline-block; vertical-align: middle; }
  #progress div { height: 100%; background: #8fd18f; width: 0; }
  main { max-width: 1180px; margin: 16px auto; background: var(--panel); padding: 16px 24px 24px; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  h2 { margin: 0 0 4px; }
  .tag { background: #f0ad4e; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 13px; margin-left: 8px; }
  .meta { color: var(--muted); margin-bottom: 10px; }
  .steps { display: flex; gap: 6px; margin: 8px 0 14px; }
  .steps span { padding: 4px 10px; border-radius: 4px; background: #ddd; font-size: 13px; }
  .steps span.on { background: var(--accent); color: #fff; }
  .steps span.done { background: #9bb; color: #fff; }
  .target img { max-width: 100%; max-height: 1000px; border: 2px solid var(--accent); display: block; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-items: start; }
  .grid figure { margin: 0; }
  .grid img { width: 100%; border: 1px solid #999; cursor: zoom-in; display: block; }
  .grid figure.t img { border: 3px solid var(--accent); }
  .grid figcaption { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .grid figure.t figcaption { color: var(--accent); font-weight: 600; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 6px; height: 90px; }
  fieldset { border: 1px solid var(--line); border-radius: 4px; margin: 10px 0; padding: 8px 12px; }
  legend { font-weight: 600; }
  .checks label, .radios label { display: inline-block; margin: 3px 14px 3px 0; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 13px; }
  .readonly { background: #f7f7f7; border: 1px dashed #bbb; padding: 8px 12px; border-radius: 4px; margin: 8px 0; white-space: pre-wrap; }
  .nav { margin-top: 16px; display: flex; gap: 10px; align-items: center; }
  .nav .grow { flex: 1; }
  button.primary { background: var(--accent); color: #fff; border: 0; padding: 7px 16px; border-radius: 4px; font-size: 15px; cursor: pointer; }
  #errors { color: #c00; margin-top: 8px; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
  #zoom img { max-width: 96vw; max-height: 96vh; background: #fff; }
  .instructions li { margin-bottom: 6px; }
  @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } main { margin: 0; border-radius: 0; padding: 12px 16px; } }
</style>
</head>
<body>
<header>
  <strong>Page description study</strong>
  <span id="who"></span>
  <span class="grow"></span>
  <span id="progtext"></span><span id="progress"><div></div></span>
  <button id="btn-first">First unfinished</button>
  <button id="btn-export">Export</button>
  <label>Import <input type="file" id="btn-import" accept=".json,application/json" style="width:170px"></label>
</header>
<main id="app"></main>
<div id="zoom"><img alt=""></div>

<script src="items.js"></script>
<script>
"use strict";
var FORM_VERSION = "1";
var CUES = [["title", "Section or statement title"], ["caption", "Table or figure caption"],
            ["labels", "Row or column labels"], ["period", "Dates or time periods"], ["numbers", "Specific numbers"],
            ["entities", "Names of people, products, places"], ["pagelabel", "Printed page number"],
            ["visual", "Colours, pictures or visual style"], ["layout", "Position or layout on the page"],
            ["other", "Other (say in notes)"]];
var ITEMS = window.ITEMS || [];
var S = null, cur = 0, app = document.getElementById("app");

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function safeName(n) { return n.trim().replace(/[^A-Za-z0-9_-]+/g, "_").slice(0, 40); }
function storeKey(name) { return "idea5_human_v" + FORM_VERSION + "_" + safeName(name); }
function words(s) { return String(s || "").trim().split(/\s+/).filter(function (w) { return w.length > 0; }).length; }
function blank() { return { stage: 1, generic: "", distinct: "", cues: [], confidence: "", notes: "", t1_start: null, t1_s: null, t2_start: null, t2_s: null }; }
function st(id) { if (!S.items[id]) S.items[id] = blank(); return S.items[id]; }
function save() { try { localStorage.setItem(storeKey(S.annotator), JSON.stringify(S)); } catch (e) { alert("Autosave failed. Please export now. " + e); } }
function done(id) { return S.items[id] && S.items[id].stage === 3; }
function firstUnfinished() { for (var i = 0; i < ITEMS.length; i++) if (!done(ITEMS[i].item_id)) return i; return ITEMS.length; }

function progress() {
  var real = ITEMS.filter(function (it) { return !it.practice; });
  var n = real.filter(function (it) { return done(it.item_id); }).length;
  document.getElementById("progtext").textContent = n + " / " + real.length + " done";
  document.querySelector("#progress div").style.width = (real.length ? 100 * n / real.length : 0) + "%";
  document.getElementById("who").textContent = S ? "Annotator: " + S.annotator : "";
}

function start() {
  app.innerHTML = '<h2>Before you start</h2>' +
    '<ol class="instructions">' +
    '<li>You play the part of a model that writes a short text description of every page of a long document, once, before anyone asks a question. The descriptions go into a search index next to the page images.</li>' +
    '<li><b>Stage 1.</b> You see one page (the target) on its own. Write 2 to 4 sentences describing it for the search index, so that someone looking for the information on it would find it.</li>' +
    '<li><b>Stage 2.</b> You then also see the three pages of the same document that a retriever finds most similar to the target. Write a new 2 to 4 sentence description of the target that would also let a search tell it apart from those three pages. Tick the cues you used.</li>' +
    '<li>You cannot change the stage 1 text after you see the similar pages. Click any image to enlarge it.</li>' +
    '<li>You never see a question. Do not look up the questions for these documents while annotating.</li>' +
    '<li>Items P1 and P2 are practice and are not analysed. Work autosaves in this browser. Click <b>Export</b> at the end (and whenever you stop) and send the JSON file.</li>' +
    '</ol>' +
    '<label>Your name or initials: <input id="name" type="text" style="width:200px"></label> ' +
    '<button class="primary" id="go">Start</button>';
  document.getElementById("go").onclick = function () {
    var name = document.getElementById("name").value.trim();
    if (!name) { alert("Please enter a name."); return; }
    var saved = localStorage.getItem(storeKey(name));
    S = saved ? JSON.parse(saved) : { annotator: name, form_version: FORM_VERSION, items: {} };
    save(); cur = firstUnfinished(); render();
  };
}

function fig(src, cap, isTarget) {
  return '<figure class="' + (isTarget ? "t" : "") + '"><img src="' + src + '" alt="' + esc(cap) + '"><figcaption>' + esc(cap) + '</figcaption></figure>';
}

function render() {
  progress();
  if (cur >= ITEMS.length) {
    app.innerHTML = '<h2>All items done</h2><p>Thank you. Click <b>Export</b> and send the JSON file.</p>' +
      '<div class="nav"><button id="prev">Back</button></div>';
    document.getElementById("prev").onclick = function () { cur = ITEMS.length - 1; render(); };
    return;
  }
  var it = ITEMS[cur], s = st(it.item_id), id = it.item_id;
  var head = '<h2>Item ' + esc(id) + (it.practice ? '<span class="tag">practice</span>' : '') + '</h2>' +
    '<div class="meta">' + esc(it.doc_type) + ' &middot; target is page ' + it.target_page + ' of ' + it.n_pages + '</div>' +
    '<div class="steps"><span class="' + (s.stage === 1 ? "on" : "done") + '">1. Target alone</span>' +
    '<span class="' + (s.stage === 2 ? "on" : s.stage === 3 ? "done" : "") + '">2. Next to similar pages</span></div>';
  var tsrc = "img/" + id + "_t.jpg";
  var html = head;
  if (s.stage === 1) {
    if (!s.t1_start) { s.t1_start = Date.now(); save(); }
    html += '<div class="target"><img src="' + tsrc + '" alt="target page"></div>' +
      '<fieldset><legend>Description for the search index (2 to 4 sentences)</legend>' +
      '<textarea id="generic">' + esc(s.generic) + '</textarea><div class="hint" id="wc"></div></fieldset>' +
      '<div class="nav"><button id="prev">Back</button><span class="grow"></span>' +
      '<button class="primary" id="next1">Lock and show similar pages</button></div><div id="errors"></div>';
  } else {
    if (!s.t2_start) { s.t2_start = Date.now(); save(); }
    html += '<div class="grid">' + fig(tsrc, "Target: page " + it.target_page, true);
    it.sibling_pages.forEach(function (p, k) { html += fig("img/" + id + "_s" + (k + 1) + ".jpg", "Similar " + "ABC"[k] + ": page " + p, false); });
    html += '</div><p class="hint">Stage 1 description (locked):</p><div class="readonly">' + esc(s.generic) + '</div>' +
      '<fieldset><legend>Description that also tells the target apart from A, B and C (2 to 4 sentences)</legend>' +
      '<textarea id="distinct">' + esc(s.distinct) + '</textarea><div class="hint" id="wc"></div></fieldset>' +
      '<fieldset><legend>Cues you used to tell the target apart (tick all)</legend><div class="checks">' +
      CUES.map(function (c) { return '<label><input type="checkbox" value="' + c[0] + '"' + (s.cues.indexOf(c[0]) >= 0 ? " checked" : "") + '> ' + esc(c[1]) + '</label>'; }).join("") +
      '</div></fieldset>' +
      '<fieldset><legend>How sure are you that your description singles out the target? (1 = not at all, 5 = certain)</legend><div class="radios">' +
      [1, 2, 3, 4, 5].map(function (v) { return '<label><input type="radio" name="conf" value="' + v + '"' + (String(s.confidence) === String(v) ? " checked" : "") + '> ' + v + '</label>'; }).join("") +
      '</div></fieldset>' +
      '<fieldset><legend>Notes (optional)</legend><textarea id="notes" style="height:50px">' + esc(s.notes) + '</textarea></fieldset>' +
      '<div class="nav"><button id="prev">Back</button><span class="grow"></span>' +
      '<button class="primary" id="next2">Save and next</button></div><div id="errors"></div>';
  }
  app.innerHTML = html;
  app.querySelectorAll("img").forEach(function (im) { im.onclick = function () { var z = document.getElementById("zoom"); z.querySelector("img").src = im.src; z.style.display = "flex"; }; });
  document.getElementById("prev").onclick = function () { keep(); if (cur > 0) cur--; render(); };
  var ta = document.getElementById(s.stage === 1 ? "generic" : "distinct");
  var wc = function () { document.getElementById("wc").textContent = words(ta.value) + " words"; };
  ta.oninput = function () { keep(); wc(); }; wc();
  if (s.stage === 1) {
    document.getElementById("next1").onclick = function () {
      keep();
      if (words(s.generic) < 8) { document.getElementById("errors").textContent = "Please write at least 8 words."; return; }
      s.t1_s = Math.round((Date.now() - s.t1_start) / 1000); s.stage = 2; save(); render();
    };
  } else {
    document.getElementById("next2").onclick = function () {
      keep();
      var err = [];
      if (words(s.distinct) < 8) err.push("Please write at least 8 words.");
      if (!s.cues.length) err.push("Tick at least one cue.");
      if (!s.confidence) err.push("Choose a confidence.");
      if (err.length) { document.getElementById("errors").textContent = err.join(" "); return; }
      if (s.stage === 2) s.t2_s = Math.round((Date.now() - s.t2_start) / 1000);
      s.stage = 3; save(); cur++; render();
    };
  }
}

function keep() {
  if (!S || cur >= ITEMS.length) return;
  var s = st(ITEMS[cur].item_id);
  var g = document.getElementById("generic"), d = document.getElementById("distinct"), n = document.getElementById("notes");
  if (g && s.stage === 1) s.generic = g.value;
  if (d) s.distinct = d.value;
  if (n) s.notes = n.value;
  var cs = app.querySelectorAll(".checks input:checked");
  if (d) s.cues = Array.prototype.map.call(cs, function (c) { return c.value; });
  var r = app.querySelector('input[name="conf"]:checked');
  if (r) s.confidence = Number(r.value);
  save();
}

document.getElementById("zoom").onclick = function () { this.style.display = "none"; };
document.getElementById("btn-first").onclick = function () { if (!S) return; keep(); cur = firstUnfinished(); render(); };
document.getElementById("btn-export").onclick = function () {
  if (!S) { alert("Start first."); return; }
  keep();
  var out = { annotator: S.annotator, form_version: FORM_VERSION, exported_at: new Date().toISOString(),
    items: ITEMS.map(function (it) { var s = st(it.item_id); return { item_id: it.item_id, practice: it.practice, done: s.stage === 3,
      generic: s.generic, distinct: s.distinct, cues: s.cues, confidence: s.confidence, notes: s.notes, t_generic_s: s.t1_s, t_distinct_s: s.t2_s }; }) };
  var stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
  a.download = "annotations_" + safeName(S.annotator) + "_" + stamp + ".json";
  a.click();
};
document.getElementById("btn-import").onchange = function (e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    var data = JSON.parse(r.result);
    S = { annotator: data.annotator, form_version: FORM_VERSION, items: {} };
    data.items.forEach(function (x) {
      S.items[x.item_id] = { stage: x.done ? 3 : (x.generic && words(x.generic) >= 8 && (x.distinct || x.t_generic_s) ? 2 : 1), generic: x.generic || "", distinct: x.distinct || "",
        cues: x.cues || [], confidence: x.confidence || "", notes: x.notes || "", t1_start: null, t1_s: x.t_generic_s, t2_start: null, t2_s: x.t_distinct_s };
    });
    save(); cur = firstUnfinished(); render();
  };
  r.readAsText(f);
};
progress();
start();
</script>
</body>
</html>
